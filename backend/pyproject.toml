[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Regras padrão do ruff (E4/E7/E9 + F). E741 (nome de variável "ambíguo",
# ex.: l/o/i) é apenas estilístico e não agrega aqui → ignorado.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Migrações Alembic são geradas/semi-geradas; não valem lint rigoroso.
"alembic/**" = ["E402", "F401"]
