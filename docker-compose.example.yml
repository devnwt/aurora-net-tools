# ==========================================================================
# Aurora Prisma NetTools — Docker Compose (modelo de DEV / build local)
#
# Este arquivo é um TEMPLATE versionado. Copie para `docker-compose.yml`
# (que fica fora do git) e ajuste ao seu ambiente:
#
#   cp docker-compose.example.yml docker-compose.yml
#   cp .env.example .env      # e edite os segredos
#   docker compose up -d --build
#
# Para deploy a partir do Harbor (sem build), use docker-compose.harbor.yml.
# ==========================================================================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurora}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: ${REGISTRY:-registry.aurora.app.br/aurora-nettools}/backend:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    # MIBs agora são embutidas na imagem (backend/mibs → /app/mibs), sem volume.
    # Logs brutos da observabilidade (aba /logs → Observabilidade). Bind mount
    # para o Master conseguir ler o histórico mesmo depois de recriar o container.
    volumes:
      - ./log:/app/log
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # NOTA (decisão §12): bridge por padrão. Se os equipamentos restringem
    # SNMP/SSH por IP de origem, comente 'ports' acima e descomente abaixo:
    # network_mode: host

  frontend:
    build: ./frontend
    image: ${REGISTRY:-registry.aurora.app.br/aurora-nettools}/frontend:${IMAGE_TAG:-latest}
    # Sem porta publicada: o acesso é pelo proxy (Caddy). Para expor direto
    # em dev, descomente:
    # ports:
    #   - "5173:80"
    depends_on:
      - backend

  # Caddy como proxy da aplicação: roteia /api e /mcp -> backend e o restante
  # -> frontend (SPA). Ponto de entrada único em :8090.
  proxy:
    build: ./proxy
    image: ${REGISTRY:-registry.aurora.app.br/aurora-nettools}/proxy:${IMAGE_TAG:-latest}
    ports:
      - "${PROXY_PORT:-8090}:8090"
    depends_on:
      - backend
      - frontend

  # Backup dedicado: pg_dump -> S3 PRÓPRIO (BACKUP_S3_*). Isolado do app, não-root,
  # sem depender da config de S3 que vive no banco. Ver backup/README.md.
  backup:
    build: ./backup
    image: ${REGISTRY:-registry.aurora.app.br/aurora-nettools}/backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Fuso do contêiner — o horário fixo (BACKUP_AT) segue este TZ.
      TZ: ${BACKUP_TZ:-America/Sao_Paulo}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/}
      BACKUP_S3_USE_SSL: ${BACKUP_S3_USE_SSL:-true}
      # Horário fixo diário de madrugada (HH:MM no fuso TZ acima).
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-true}
      # Alerta por e-mail em QUALQUER falha (SMTP próprio do backup).
      BACKUP_ALERT_EMAIL: ${BACKUP_ALERT_EMAIL:-}
      BACKUP_SMTP_HOST: ${BACKUP_SMTP_HOST:-}
      BACKUP_SMTP_PORT: ${BACKUP_SMTP_PORT:-587}
      BACKUP_SMTP_USERNAME: ${BACKUP_SMTP_USERNAME:-}
      BACKUP_SMTP_PASSWORD: ${BACKUP_SMTP_PASSWORD:-}
      BACKUP_SMTP_FROM: ${BACKUP_SMTP_FROM:-}
      BACKUP_SMTP_USE_TLS: ${BACKUP_SMTP_USE_TLS:-true}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
