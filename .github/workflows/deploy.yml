name: Deploy Produção

# Roda quando algo entra na main (via PR aprovado) + permite redeploy manual.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# Um deploy por vez; NÃO cancela um deploy que já está em andamento.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # 'self-hosted' é o label padrão de qualquer runner self-hosted.
    # (aurora-agent-prod é o NOME do runner, não um label — por isso não vai aqui.
    #  Só use um label extra se você tiver adicionado um label custom no runner.)
    runs-on: self-hosted
    timeout-minutes: 20

    env:
      APP_DIR: /opt/aurora-net-tools

    steps:
      - name: Atualizar código
        run: |
          cd "$APP_DIR"
          git fetch origin main --prune
          git checkout -f main
          git reset --hard origin/main

      - name: Deploy
        # Usa o docker-compose.yml e o .env de produção (fora do git), presentes no host.
        run: |
          cd "$APP_DIR"
          docker compose up -d --build --remove-orphans

      - name: Verificar containers
        run: |
          cd "$APP_DIR"
          docker compose ps

      - name: Limpar imagens órfãs (higiene de disco no runner)
        run: docker image prune -f
