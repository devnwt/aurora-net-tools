name: CI

# Lint em toda abertura/atualização de PR (feature/* -> develop, develop -> main)
# e em push direto na develop. A main é protegida e só recebe via PR aprovado.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  # Permite que o build-push.yml reuse ESTES mesmos jobs como gate, em vez de
  # duplicá-los lá (duplicata divergiria com o tempo e o gate viraria ficção).
  workflow_call: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint backend (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instala ferramentas de lint
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .

  lint-frontend:
    name: Lint frontend (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instala dependências
        run: npm install
      - name: Typecheck (tsc --noEmit)
        run: npm run lint

  test-backend:
    name: Testes backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # Os testes usam Postgres de verdade (criam o banco aurora_test) e Redis.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora
          POSTGRES_DB: aurora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # O conftest força POSTGRES_DB=aurora_test (com trava de segurança).
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora
      REDIS_URL: redis://localhost:6379/0
      APP_SECRET_KEY: test-secret
      JWT_SECRET: test-jwt

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instala dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: pytest -q
